name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixeldrop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "PixelDrop v1.0.0 (Android APK)"
          draft: false
          prerelease: false
          body: |
            ## 🎉 PixelDrop v1.0.0 发布！
            
            **PixelDrop** 是一款基于【纯像素块点阵编码（ISG架构）】的文件与视频互转传输工具。
            
            ### ✨ 核心功能与亮点
            - **文件变视频（MP4）**：将任意文件直接转换为 H.264 MP4 视频，体积膨胀仅 1.2x，远优于二维码。
            - **毫秒级逆向还原**：从 MP4 视频逐帧提取黑白矩阵，毫秒级还原原始文件。
            - **100% 比特级无损校验**：内置全文件 SHA-256 密码学校验与帧级 CRC32 容错。
            - **双规格预设**：
              - `4x4 极速高密档`：单帧 7.2KB，适合网盘/邮件/原画极速传输。
              - `8x8 社交抗压档`：单帧 1.8KB，专为微信/QQ有损转码设计。
            - **Material 3 优雅设计**：支持系统一键分享与直接打开文件。
            
            ### 📥 下载安装
            点击下方 Assets 中的 **`app-release.apk`** 下载安装到 Android 手机即可使用！
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
