name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Split Per ABI for small size)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixeldrop-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "PixelDrop v1.0.3 (Android APK - 性能飙升20倍、后台进度与全新图标)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 PixelDrop v1.0.3 重磅升级说明

            ### ⚡ 核心性能革命（还原提速 20~30 倍）
            1. **底层换用 Raw 视频流直接内存解析**：彻底废弃低效的数千张 JPEG 磁盘小文件抽取与 Dart 纯软解码方式。改由 FFmpeg 原生硬件级将视频高速缩放解流为单一直读灰度流，Dart 后台 Isolate 采用纯内存位运算秒级提取，**3000+ 帧长视频还原时间由原来的 3+ 分钟骤降至几秒钟**！
            2. **消除闪存反复读写磨损**：零磁盘碎文件产生，不占手机额外垃圾存储。

            ### 📱 体验与交互全面优化
            1. **真正实时进度条**：从分块生成、FFmpeg 硬件压制、原生解流到点阵采样，全程实时计算帧数与百分比，彻底告别进度条“跳步”卡顿。
            2. **后台编解码 + 实时进度通知**：引入 `wakelock_plus` 保证切后台防锁屏休眠，并结合系统级常驻通知栏，切到桌面也能实时看到进度条。
            3. **公共下载目录归档与一键定位**：文件自动整理至系统 `Download/PixelDrop`，并细分为 `Videos` 与 `Restored` 两个子目录，界面提供【定位保存目录】按钮一键唤起系统文件管理器。
            4. **SHA-256 指纹展示与一键复制**：制作视频完成界面即刻展示源文件全局 SHA-256，支持一键复制到剪贴板。
            5. **全新专属应用图标**：换上高科技质感的点阵矩阵图标（与应用内左上角图案同源），告别安卓默认安卓机器人图标。

            ### 📥 下载安装
            请在下方 Assets 中下载适合你手机的安装包：
            - **`app-arm64-v8a-release.apk`**（**强烈推荐**，适用于绝大多数安卓手机）
            - `app-armeabi-v7a-release.apk`（适用于极老旧的 32 位安卓机型）
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
