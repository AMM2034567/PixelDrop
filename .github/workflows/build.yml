name: Build & Release Multi-Platform (Android & Windows)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk*
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Split Per ABI)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload ARMv7 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Verify Flutter & Windows Toolchain
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Bundle Portable Windows Package
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          
          # Search for real standalone ffmpeg.exe (must NOT be a ~300KB Chocolatey ShimGen shim!)
          $realFfmpeg = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffmpeg.exe" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
          if (-not $realFfmpeg) {
            Write-Host "ffmpeg not in choco lib, installing via choco..."
            choco install ffmpeg --no-progress
            $realFfmpeg = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffmpeg.exe" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
          }

          if ($realFfmpeg) {
            Write-Host "Found real standalone FFmpeg binary at $($realFfmpeg.FullName) (Size: $($realFfmpeg.Length) bytes)"
            Copy-Item $realFfmpeg.FullName -Destination "$releaseDir\ffmpeg.exe" -Force
          } else {
            # Search system for any standalone ffmpeg.exe larger than 10MB
            $fallback = Get-ChildItem -Path "C:\", "D:\" -Filter "ffmpeg.exe" -Recurse -File -Depth 5 -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
            if ($fallback) {
              Write-Host "Found fallback real FFmpeg binary at $($fallback.FullName) (Size: $($fallback.Length) bytes)"
              Copy-Item $fallback.FullName -Destination "$releaseDir\ffmpeg.exe" -Force
            } else {
              throw "Real standalone FFmpeg executable could not be found to bundle into release package!"
            }
          }
          
          # Prepare distribution folder
          $pkgDir = "build\PixelDrop"
          if (Test-Path $pkgDir) { Remove-Item $pkgDir -Recurse -Force }
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          Copy-Item -Path "$releaseDir\*" -Destination $pkgDir -Recurse -Force
          
          # Add Windows Quick Start Guide
          $readmeLines = @(
            '==================================================',
            'PixelDrop - 离线点阵视频文件传输 (Windows 桌面端) v1.0.1',
            '==================================================',
            '',
            '【快速上手】',
            '1. 双击运行 pixel_drop.exe 即可打开软件。',
            '2. 支持直接从 Windows 资源管理器拖拽任意文件或 MP4 视频到窗口中：',
            '   - 「文件转视频」：选择或拖拽文件 -> 开始生成视频 -> 导出为高密度像素矩阵点阵 MP4 视频。',
            '   - 「视频转文件」：选择或拖拽视频 -> 开始还原文件 -> 自动提取原文件并进行 100% SHA-256 位精确校验。',
            '3. 视频与还原文件默认自动保存在系统目录：',
            '   - 视频导出目录: Downloads\PixelDrop\Videos',
            '   - 文件还原目录: Downloads\PixelDrop\Restored',
            '   可随时在软件界面一键点击「定位目录」在资源管理器中高亮展示。',
            '',
            '【免安装便携版特性】',
            '- 本绿色压缩包已内置原生 FFmpeg 极速视频处理引擎与全部必要动态运行库。',
            '- 无需安装额外驱动或配置环境变量，解压即可运行。'
          )
          Set-Content -Path "$pkgDir\README.txt" -Value $readmeLines -Encoding UTF8

          # Create distribution zip
          Compress-Archive -Path $pkgDir -DestinationPath "PixelDrop-Windows-x64-v1.0.1.zip" -CompressionLevel Optimal

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelDrop-Windows-x64-v1.0.1.zip
          path: PixelDrop-Windows-x64-v1.0.1.zip

  release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Downloaded Release Files
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PixelDrop v1.0.1 正式发布版 (稳定性与中文路径热修复)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 PixelDrop v1.0.1 正式发布版：稳定性与中文路径热修复！

            无需数据线、无需配对局域网、跨系统物理隔离！在 Windows 电脑与 Android 手机之间通过像素矩阵视频自由传递任意格式文件，比特级 100% SHA-256 位精确无损还原。

            ---

            ### 🐛 v1.0.1 热修复 (Bug Fixes)
            - **修复非 ASCII / 中文路径 URI 编码异常 (`Illegal percent encoding in URI`)**：移除了文件名解析过程中多余的 URI 组件解码调用，直接采用原生跨平台路径提取工具，完美兼容中文、日文、空格、特殊符号及含 `%` 字符的文件与文件夹；
            - **全面增强解码端文件卡片安全性**：彻底杜绝了载入中文名或特殊符号视频时界面报非法编码的问题。

            ---

            ### 🌟 核心特性一览 (Key Features)

            #### 1. 🎨 RGB 8 色高密编码与黑白双协议
            - **RGB 8 色协议 (`PD02`)**：单像素点携带 3 个比特数据（8 种离散基色），视频体积大幅减小 **~60%**，生成速度翻倍；
            - **经典黑白协议 (`PXL1`)**：1 比特/像素，极端翻拍环境下的高稳健性回退。

            #### 2. 🛡️ Cauchy Reed-Solomon 帧级纠删码 (FEC 掉帧容灾)
            - 采用基于伽罗瓦域 $GF(2^8)$ 的 Cauchy Reed-Solomon 算法，支持可配置的帧级冗余度（10% ~ 30%）；
            - 视频即使被平台或播放器截断首尾、或因网络抽帧丢弃部分关键帧，**只要有效帧数达标，即可 100% 逆向重构缺失画面并精确还原**。

            #### 3. 📦 多文件拖拽与文件夹一键归档
            - **流式打包**：直接将多个散落文件或嵌套文件夹拖入窗口，后台基于微任务自动切片压缩为 ZIP 视频流，界面毫无卡顿；
            - **智能解压**：还原后支持一键解压，自动识别并消除冗余多层同名父目录，内置严密的 **Zip-Slip 目录穿越安全防御**。

            #### 4. 📱 Android 移动端系统级极速交互
            - 深度集成 Android 原生 **`ACTION_SEND` / `ACTION_SEND_MULTIPLE`**：在手机文件管理器或相册中长按文件/视频，点击「分享到 PixelDrop」即可直接唤起并自动装配任务；
            - 原生前台服务（Foreground Service）配合 **`PARTIAL_WAKE_LOCK`**，切后台、刷其他软件或锁屏息屏状态下 CPU 满速稳定运行，拒绝系统杀后台。

            #### 5. 🪟 Windows 桌面端绿色免安装便携体验
            - 内置原生极速 FFmpeg 视频处理引擎与全部动态运行库，解压即可运行；
            - 支持全窗口直接拖拽识别，还原后一键在资源管理器中定位高亮选中目标文件。

            #### 6. 🌐 社交与短视频平台免压兼容
            - **轻量静音音轨注入**：针对微信视频号、抖音、B站等对纯无声 MP4 的上传拦截或暴力重采样问题，自动注入一条 32kbps AAC 无损静音流（1分钟视频仅增约 3~4 KB）；
            - **Web 快速启动 (`+faststart`)**：自动将 `moov atom` 元数据挪至 MP4 最前部，支持网盘与网页端秒开预览与流式秒读。

            ---

            ### 📥 客户端下载指南 (Assets)

            | 平台 / 系统 | 推荐下载文件 | 说明 |
            | :--- | :--- | :--- |
            | 🪟 **Windows 64位** | **`PixelDrop-Windows-x64-v1.0.1.zip`** | 绿色免安装正式版，内置极速 FFmpeg 引擎，解压双击 `pixel_drop.exe` 即开即用 |
            | 🤖 **Android (推荐)** | **`app-arm64-v8a-release.apk`** | 适用于近几年发布的绝大多数 64 位安卓智能手机 |
            | 🤖 **Android (老旧机型)** | **`app-armeabi-v7a-release.apk`** | 适用于 32 位老旧安卓设备 |
            | 🐧 **Linux** | *规划待动工 (免安装 tar.gz 便携包)* | 详见仓库文档 `docs/LINUX_TODO.md` |
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
