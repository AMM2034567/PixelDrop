name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Split Per ABI for small size)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixeldrop-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "PixelDrop v1.0.4 (Android APK - 修复中大型多帧文件还原 & 真正后台常驻保活)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 PixelDrop v1.0.4 紧急重磅修复版

            ### 🛠️ 关键修复：中大型多分块文件 100% 完美还原
            - **排查根因**：之前版本中高频内存复用缓冲区在多帧遍历时导致已收集的所有分块指向了同一块动态内存，从而在超过 1 帧的文件还原时触发了 `FormatException: Invalid UTF-8 byte`。
            - **彻底修复**：在帧协议解析与多帧归集层强制进行独立数据深拷贝（`Uint8List.fromList`），彻底解决多分块拼装错位问题，**中型与大型文件（如 10MB+ MP3、视频、文档）全部 100% SHA-256 位精确校验还原！**

            ### 🛡️ 真正的安卓原生前台保活服务（Foreground Service）
            - **杜绝杀后台**：引入标准安卓原生前台服务（`PixelDropService`）并持有系统级 `PARTIAL_WAKE_LOCK`，应用在切到桌面、刷抖音/微信甚至手机锁屏时，**后台进程依然持续高速编码和还原，绝不被系统冻结或杀后台！**
            - **通知栏直达**：前台常驻通知实时联动最新任务百分比，点击通知栏即可随时唤回应用前台。

            ### ⚡ 其他保留亮点
            - 原生 Raw 灰度直读秒级解析架构（数千帧视频几秒内还原完毕）
            - 自动归档至公共目录 `Download/PixelDrop/Videos` 与 `Restored`，并有一键【定位保存目录】
            - 编码完成展示 SHA-256 并支持一键复制
            - 全新专属点阵科技图标

            ### 📥 下载安装
            请在下方 Assets 中下载适合你手机的安装包：
            - **`app-arm64-v8a-release.apk`**（**强烈推荐**，适用于绝大多数安卓手机）
            - `app-armeabi-v7a-release.apk`（适用于极老旧的 32 位安卓机型）
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
