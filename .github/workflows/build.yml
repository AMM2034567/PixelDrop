name: Build & Release Multi-Platform (Android & Windows)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Split Per ABI)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload ARMv7 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Verify Flutter & Windows Toolchain
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Bundle Portable Windows Package
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          
          # Search for real standalone ffmpeg.exe (must NOT be a ~300KB Chocolatey ShimGen shim!)
          $realFfmpeg = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffmpeg.exe" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
          if (-not $realFfmpeg) {
            Write-Host "ffmpeg not in choco lib, installing via choco..."
            choco install ffmpeg --no-progress
            $realFfmpeg = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffmpeg.exe" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
          }

          if ($realFfmpeg) {
            Write-Host "Found real standalone FFmpeg binary at $($realFfmpeg.FullName) (Size: $($realFfmpeg.Length) bytes)"
            Copy-Item $realFfmpeg.FullName -Destination "$releaseDir\ffmpeg.exe" -Force
          } else {
            # Search system for any standalone ffmpeg.exe larger than 10MB
            $fallback = Get-ChildItem -Path "C:\", "D:\" -Filter "ffmpeg.exe" -Recurse -File -Depth 5 -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
            if ($fallback) {
              Write-Host "Found fallback real FFmpeg binary at $($fallback.FullName) (Size: $($fallback.Length) bytes)"
              Copy-Item $fallback.FullName -Destination "$releaseDir\ffmpeg.exe" -Force
            } else {
              throw "Real standalone FFmpeg executable could not be found to bundle into release package!"
            }
          }
          
          # Prepare distribution folder
          $pkgDir = "build\PixelDrop"
          if (Test-Path $pkgDir) { Remove-Item $pkgDir -Recurse -Force }
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          Copy-Item -Path "$releaseDir\*" -Destination $pkgDir -Recurse -Force
          
          # Add Windows Quick Start Guide
          $readmeLines = @(
            '==================================================',
            'PixelDrop - 离线点阵视频文件传输 (Windows 桌面端) v0.6.0-beta',
            '==================================================',
            '',
            '【快速上手】',
            '1. 双击运行 pixel_drop.exe 即可打开软件。',
            '2. 支持直接从 Windows 资源管理器拖拽任意文件或 MP4 视频到窗口中：',
            '   - 「文件转视频」：选择或拖拽文件 -> 开始生成视频 -> 导出为高密度像素矩阵点阵 MP4 视频。',
            '   - 「视频转文件」：选择或拖拽视频 -> 开始还原文件 -> 自动提取原文件并进行 100% SHA-256 位精确校验。',
            '3. 视频与还原文件默认自动保存在系统目录：',
            '   - 视频导出目录: Downloads\PixelDrop\Videos',
            '   - 文件还原目录: Downloads\PixelDrop\Restored',
            '   可随时在软件界面一键点击「定位目录」在资源管理器中高亮展示。',
            '',
            '【免安装便携版特性】',
            '- 本绿色压缩包已内置原生 FFmpeg 极速视频处理引擎与全部必要动态运行库。',
            '- 无需安装额外驱动或配置环境变量，解压即可运行。'
          )
          Set-Content -Path "$pkgDir\README.txt" -Value $readmeLines -Encoding UTF8

          # Create distribution zip
          Compress-Archive -Path $pkgDir -DestinationPath "PixelDrop-Windows-x64-v0.6.0-beta.zip" -CompressionLevel Optimal

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelDrop-Windows-x64-v0.6.0-beta.zip
          path: PixelDrop-Windows-x64-v0.6.0-beta.zip

  release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Downloaded Release Files
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0-beta
          name: "PixelDrop v0.6.0-beta (Windows 桌面端 & Android 移动端测试版)"
          draft: false
          prerelease: true
          body: |
            ## 🧪 PixelDrop v0.6.0-beta 全平台测试版：Windows 桌面端 + Android 移动端双端发布！

            PixelDrop 现已正式迈入全平台阶段！无需数据线、无需局域网配对，即可在电脑与手机之间通过点阵视频自由传递任意格式文件，比特级 100% SHA-256 位精确无损还原。

            > 📢 **测试版说明**：本项目当前处于私有验证测试阶段（v0.x），后续待功能完备后将正式开源并发布 v1.0.0 正式版。

            ---

            ### 💻 Windows 桌面版全新特性
            - **原生免安装绿色便携包**：内置极速 FFmpeg 视频引擎与全部动态运行库，解压即用，无需配置环境变量。
            - **文件直接拖拽（Drag & Drop）**：直接从资源管理器将文件或视频拖拽进窗口，智能识别与文件夹安全过滤。
            - **精致紧凑 MD3 桌面布局**：基于 Material Design 3 的优雅深板岩灰蓝（Slate Charcoal）质感，配备高质感 `NavigationRail` 侧边栏与紧凑黄金比例窗口（860 × 620），高分屏自适应缩放无虚化。
            - **系统级资源管理器联动**：生成视频或还原文件后，支持一键在 Windows Explorer 中自动定位并高亮选中目标文件。
            - **专属 24 点阵矢量图标**：完美绑定 Windows 任务栏、窗口标题栏与 Alt+Tab 多任务切换的高清多尺寸 ICO 图标。

            ### 📱 Android 移动版核心体验
            - **1:1 复刻专属 24 像素同心点阵图标**：适配标准方圆桌面图标与原生圆形图标，通知栏配备纯白镂空剪影图标。
            - **原生前台服务与硬件唤醒锁保活**：锁屏或切换其他应用时 CPU 全速运行不中断，拒绝系统杀后台。
            - **极速 Raw 灰度直读解码**：视频解析毫秒级，数千帧仅需数秒。
            - **系统下载区自动归档**：自动归纳至手机公共下载目录 `Download/PixelDrop`。

            ---

            ### 📥 客户端下载指南 (Assets)

            | 平台 / 系统 | 推荐下载文件 | 说明 |
            | :--- | :--- | :--- |
            | 🪟 **Windows 64位** | **`PixelDrop-Windows-x64-v0.6.0-beta.zip`** | 绿色免安装测试版，解压后双击 `pixel_drop.exe` 即开即用 |
            | 🤖 **Android (推荐)** | **`app-arm64-v8a-release.apk`** | 适用于市面上绝大多数 64 位安卓手机 |
            | 🤖 **Android (老旧机型)** | **`app-armeabi-v7a-release.apk`** | 适用于 32 位老旧安卓设备 |
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
