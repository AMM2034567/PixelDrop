name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Split Per ABI for small size)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixeldrop-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "PixelDrop v1.0.2 (Android APK - 修复中文路径抽帧与还原异常)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 PixelDrop v1.0.2 更新说明 (关键修复版)
            
            ### 🛠️ 关键修复与优化
            1. **彻底修复抽帧报错 Bug**：解决因中文文件名（如 `抖音极速版`）或包含空格导致的 FFmpeg JNI 原生路径解析失败问题。现抽帧前安全复制为纯 ASCII 缓存路径，并改用 `executeWithArguments` 原生安全参数数组调用。
            2. **智能规格自适应回退**：还原界面采样时增加智能回退容错，若选定规格未检测到数据帧，自动尝试 8x8 规格无缝对齐解析。
            3. **精准友好错误诊断弹窗**：剥离 FFmpeg 冗长启动配置头，提取关键末尾错误并提供全屏可复制弹窗，排错一目了然。
            4. **临时缓存自动清理**：在 `finally` 中严格清理过程临时抽帧图像与安全副本，不占用手机内部存储空间。
            
            ### 📥 下载安装
            请在下方 Assets 中下载适合你手机的安装包：
            - **`app-arm64-v8a-release.apk`**（**强烈推荐**，适用于近 8 年发布的绝大多数安卓手机）
            - `app-armeabi-v7a-release.apk`（适用于极老旧的 32 位安卓机型）
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
