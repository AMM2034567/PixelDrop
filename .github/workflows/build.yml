name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Split Per ABI for small size)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixeldrop-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "PixelDrop v1.0.5 (Android APK - 全新 MD3 质感界面 & 1:1 专属点阵图标)"
          draft: false
          prerelease: false
          body: |
            ## 🎨 PixelDrop v1.0.5 全新界面重构与 1:1 点阵图标升级版

            ### 🖌️ 1:1 严格还原专属点阵图标
            - **桌面图标**：严格按参考图 1:1 几何生成 24 点同心矩阵，提供标准方圆与原生圆形图标（`ic_launcher.png` / `ic_launcher_round.png`），适配各类手机桌面。
            - **状态栏通知小图标**：提供专用的纯白透底剪影小图标（`ic_notification.png`），避免 Android 8.0+ 状态栏变实心白方块或系统通知崩溃。
            - **应用内矢量组件**：新增无损高保真 `DotMatrixLogo` 组件，常驻 AppBar 与说明弹窗。

            ### ✨ 深度去 AI 味与纯正 Material Design 3 体验
            - **克制优雅的视觉基调**：摒弃粗制滥造的紫粉霓虹与浮夸光效，换用典雅沉稳的 Slate Charcoal（板岩灰蓝）MD3 质感设计。
            - **符合直觉的人机流程**：
              - 选文件卡片新增【清除选择】（`✕`）与【更换】功能；
              - 编码/解码规格采用纯粹清晰的 `SegmentedButton`；
              - 移除一切虚假科技感黑话文案，回归清晰明确的标准工程用语；
              - 修复 320dp 窄屏与系统超大字体无障碍缩放下的布局溢出。

            ### ⚡ 核心能力无损保留
            - Raw 灰度直读秒级秒级解析架构（数千帧数秒还原）
            - 100% SHA-256 位精确校验与一键复制哈希
            - 安卓原生前台保活服务 + 唤醒锁（锁屏与切后台满速处理不中断）
            - 自动归档至系统公共下载目录 `Download/PixelDrop`

            ### 📥 下载安装
            请在下方 Assets 中下载适合你手机的安装包：
            - **`app-arm64-v8a-release.apk`**（**强烈推荐**，适用于绝大多数安卓手机）
            - `app-armeabi-v7a-release.apk`（适用于老旧的 32 位安卓机型）
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
